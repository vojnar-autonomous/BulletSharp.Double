name: .NET Core

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x
    - name: Install dependencies
      run: dotnet restore BulletSharp.Double.sln
    - name: Build
      run: dotnet build --configuration Release --no-restore BulletSharp.Double.sln
    - name: Test
      run: dotnet test --no-restore --verbosity normal BulletSharp/test/BulletSharpTest.csproj
